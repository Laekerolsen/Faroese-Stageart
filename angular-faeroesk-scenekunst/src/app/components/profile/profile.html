
<div *ngIf="currentInvoiceAddress() as invoiceAddress" class="payment-page">

  <h2 class="text-2xl font-bold">Din profil</h2>

  <!-- InVOICE ADDRESS -->
    <div class="box">
      <h3 class="text-1xl font-bold">Senest gemte faktureringsadresse</h3>
      <p>
        {{ invoiceAddress.name }}<br />
        {{ invoiceAddress.street }}<br />
        {{ invoiceAddress.zipCode }} {{ invoiceAddress.city }}<br />
        {{ invoiceAddress.country }}<br />
        {{ invoiceAddress.phone }}<br />
        {{ invoiceAddress.email }}
      </p>
    </div>

    <a *ngIf="showOrdersListPageLink() && hasOldOrders()" [routerLink]="['/ordrer']" class="text-blue-500 hover:underline">Se dine gemte ordrer</a>

</div>
<div *ngIf="currentInvoiceAddress() && showDivider()" class="divider" role="separator" aria-label="Divider"></div>
